[project]
name = "pbmc-geneformer-vs-pca"
version = "0.1.0"
description = "Do zero-shot Geneformer embeddings (via the Helical SDK) separate PBMC3k cell types better than Scanpy PCA?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "helical==3.1.3",
    # helical pins this exact version; listed here because the code imports torch to fix seeds.
    "torch==2.10.0",
    "scanpy==1.12",
    "anndata==0.12.19",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pytest==9.1.1",
    "leidenalg==0.12.0",
    "igraph==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbmc_fm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ even when it has not been installed.
pythonpath = ["src"]

[tool.uv]
# torch 2.10.0 (pinned by helical) has no wheel for Intel Macs, so only these platforms are supported.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

# On Linux the PyPI torch wheel pulls in ~18 CUDA packages; the CPU-only build avoids them.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
